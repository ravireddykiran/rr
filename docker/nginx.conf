server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain application/json application/javascript image/svg+xml audio/x-mpegurl application/vnd.apple.mpegurl;
    gzip_min_length 1024;

    types {
        audio/x-mpegurl m3u;
        application/vnd.apple.mpegurl m3u8;
        application/manifest+json webmanifest;
    }

    location / {
        add_header Access-Control-Allow-Origin *;
        try_files $uri $uri/ =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
}
